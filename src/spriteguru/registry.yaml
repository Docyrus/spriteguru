# Model ids, fixed parameters, prices and the route table (sections 6.5 and 8).
# Prices are estimates written to the ledger; reconcile them against provider dashboards monthly.

providers:
  openai: {concurrency: 4, timeout_s: 180, env: OPENAI_API_KEY}
  fal: {concurrency: 4, timeout_s: 600, env: FAL_KEY}
  retrodiffusion: {concurrency: 4, timeout_s: 600, env: RD_API_KEY}
  quiver: {concurrency: 4, timeout_s: 1200, env: QUIVERAI_API_KEY}
  synthetic: {concurrency: 4, timeout_s: 60, env: null}

models:
  gpt-image-2.5-flare:
    provider: openai
    label: GPT Image 2.5 Flare
    maker: OpenAI
    role: guided sheets
    op: edit
    image: {mask: true, max_inputs: 16}
    params: {quality: high, background: opaque, n: 2, output_format: png}
    price:
      # token-billed; estimate per output image from its pixel count
      usd_per_mtok_text_in: 5.0
      usd_per_mtok_image_in: 8.0
      usd_per_mtok_image_out: 30.0
      out_tokens_per_mpx_high: 4000   # estimate used when the response carries no usage
      in_tokens_per_mpx: 1300
  gpt-image-2.5-sunburst:
    provider: openai
    label: GPT Image 2.5 Sunburst
    maker: OpenAI
    role: turnarounds, frame repairs, in-betweens
    op: edit
    image: {mask: true, max_inputs: 16}
    params: {quality: high, background: opaque, n: 1, output_format: png}
    price:
      usd_per_mtok_text_in: 5.0
      usd_per_mtok_image_in: 8.0
      usd_per_mtok_image_out: 30.0
      out_tokens_per_mpx_high: 4000   # estimate used when the response carries no usage
      in_tokens_per_mpx: 1300
  # Selectable image models through fal (IM1-IM10). `endpoints` maps our ops to fal endpoints; `image`
  # holds what the fal adapter needs: mask support, the output pixel range, images per call, seeds.
  seedream-5.0-flash:
    provider: fal
    label: Seedream 5.0 Flash
    maker: ByteDance
    role: selectable image model
    op: edit
    endpoints: {edit: bytedance/seedream/v5/flash/edit, generate: bytedance/seedream/v5/flash/text-to-image}
    params: {n: 2}
    image: {mask: false, max_inputs: 10, min_pixels: 1048576, max_pixels: 4194304, per_call: 6, seed: false}
    price: {usd_per_image: 0.027}
  seedream-5.0-pro:
    provider: fal
    label: Seedream 5.0 Pro
    maker: ByteDance
    role: selectable image model
    op: edit
    endpoints: {edit: bytedance/seedream/v5/pro/edit, generate: bytedance/seedream/v5/pro/text-to-image}
    params: {n: 2}
    image: {mask: false, max_inputs: 10, min_pixels: 1048576, max_pixels: 4194304, per_call: 6, seed: false}
    price: {usd_per_image: 0.0675}
  seedream-5.0-lite:
    provider: fal
    label: Seedream 5.0 Lite
    maker: ByteDance
    role: selectable image model
    op: edit
    endpoints: {edit: bytedance/seedream/v5/lite/edit, generate: bytedance/seedream/v5/lite/text-to-image}
    params: {n: 2}
    image: {mask: false, max_inputs: 10, min_pixels: 3686400, max_pixels: 16777216, per_call: 6, seed: false}
    price: {usd_per_image: 0.035}
  flux-2-max:
    provider: fal
    label: FLUX.2 [max]
    maker: Black Forest Labs
    role: selectable image model
    op: edit
    endpoints: {edit: fal-ai/flux-2-max/edit, generate: fal-ai/flux-2-max}
    params: {n: 2}
    image: {mask: false, max_inputs: 10, min_pixels: 262144, max_pixels: 4194304, per_call: 1, seed: true}
    price: {usd_first_mp: 0.07, usd_per_extra_mp: 0.03}  # input images count as processed megapixels
  rd-advanced-animation:
    provider: retrodiffusion
    role: pixel loops
    op: rd_animate
    params: {return_spritesheet: true}
    price: {usd_per_call: 0.14, usd_per_call_custom_action: 0.25}
  minimax/h3-max/image-to-video:
    provider: fal
    role: HD loops
    op: video
    params: {duration: 5, resolution: 768P, prompt_expansion_mode: disabled}
    price: {usd_per_second: 0.08, promo_usd_per_second: 0.04, promo_until: "2026-09-30"}
  arrow-2:
    provider: quiver
    role: vector characters, vector idle
    op: svg
    # generation at high effort (~45 s). Animation at high effort stalled for 15+ minutes in live
    # tests and low is rejected ("not supported yet"); medium returns in about a minute.
    params: {reasoning_effort: high, animate_reasoning_effort: medium, stream: true}
    price: {usd_per_mtok_in: 4.0, usd_per_mtok_out: 20.0, est_tokens_in: 3000, est_tokens_out: 12000}
  gpt-6-sol:
    provider: openai
    role: vector motion and rigging
    op: respond
    params: {reasoning_effort: medium}
    price: {usd_per_mtok_in: 2.0, usd_per_mtok_out: 10.0, est_tokens_in: 12000, est_tokens_out: 6000}
  gpt-6-luna:
    provider: openai
    role: QA judge
    op: respond
    params: {reasoning_effort: xhigh}
    price: {usd_per_mtok_in: 0.10, usd_per_mtok_out: 0.50, est_tokens_in: 8000, est_tokens_out: 4000}
  rd-pixel-fixer:
    provider: retrodiffusion
    role: pixel benchmark baseline
    op: rd_fix
    params: {}
    price: {usd_per_call: 0.0}

roles:
  guided_sheet: gpt-image-2.5-flare
  turnaround: gpt-image-2.5-sunburst
  repair: gpt-image-2.5-sunburst
  inbetween: gpt-image-2.5-sunburst
  pixel_loop: rd-advanced-animation
  hd_loop: minimax/h3-max/image-to-video
  vector_character: arrow-2
  vector_idle: arrow-2
  vector_motion: gpt-6-sol
  judge: gpt-6-luna

# Image tasks the user can point at another model (Settings > Image models, `spriteguru models`); each
# task's default is its role above.
image_tasks:
  guided_sheet: Sprite sheets
  turnaround: Turnarounds
  repair: Frame repairs
  inbetween: In-betweens
image_models: [gpt-image-2.5-flare, gpt-image-2.5-sunburst, seedream-5.0-flash, seedream-5.0-pro, seedream-5.0-lite,
               flux-2-max]

# route[style][loop|oneshot]; idle vector loops use Quiver, other vector loops use AI-coded motion
routes:
  pixel: {loop: rd-loop, oneshot: guided-pixel}
  hd-cartoon: {loop: video-loop, oneshot: guided}
  painted: {loop: video-loop, oneshot: guided}
  vector: {loop: vector-motion, idle: vector-idle, oneshot: vector-motion}

# Action planning targets (6.2): cell aspect of the widest pose
aspect_targets: {idle: 0.8, walk: 0.9, run: 1.1, attack-melee: 1.3, jump: 0.9, cast: 1.0, hurt: 0.9, death: 1.3, crouch: 0.9, climb: 0.8, push: 1.1, fireball: 1.3, intro: 1.0, intro-weapon: 1.3, projectile: 1.4, charge: 1.0, impact: 1.0, explosion: 1.0, aura: 1.0, work: 1.0, activate: 1.0, break: 1.0, move: 1.6, fire: 1.6, destroyed: 1.6}
