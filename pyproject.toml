[project]
name = "spriteguru"
version = "0.1.0"
description = "SpriteGuru: local-first sprite studio"
readme = "README.md"
authors = [
    { name = "anilbeyazoglu", email = "anil@beyazoglu.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=18.1.0",
    "defusedxml>=0.7.1",
    "fal-client>=1.0.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "lxml>=6.1.3",
    "numba>=0.67.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "openai>=3.19.2",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "python-multipart>=0.0.32",
    "python-tsp>=0.5.0",
    "pyyaml>=6.0.3",
    "rembg>=2.0.69",
    "rich>=15.0.0",
    "scikit-image>=0.24.0",
    "scipy>=1.18.1",
    "svgelements>=1.9.6",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
]

[project.scripts]
spriteguru = "spriteguru.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "pywebview>=6.2.1",
]

[tool.pytest.ini_options]
testpaths = ["e2e"]
pythonpath = ["e2e"]
addopts = "-p no:cacheprovider -n 6 --dist worksteal"
filterwarnings = ["ignore::DeprecationWarning", "ignore::RuntimeWarning"]
